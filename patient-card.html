<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartCare AI – Patient Info</title>
<style>
  :root{
    --bg:#0a1628; --bg2:#0f1e35; --bg3:#16263f; --bg4:#1c3050;
    --border:#243854; --border2:#2d4468;
    --text:#eaf1fb; --text2:#a9bfd9; --text3:#6b88a8;
    --green:#10a36e; --amber:#f5a623; --red:#e5484d;
    --blue:#4fa8e8; --navy:#14407a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;padding:20px 14px 40px}
  .wrap{max-width:460px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),#7c9cf0);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#fff;flex-shrink:0}
  .brand-name{font-size:14px;font-weight:700}
  .brand-sub{font-size:10.5px;color:var(--text3)}
  .warn{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3);border-radius:10px;padding:10px 13px;font-size:11px;color:var(--amber);line-height:1.55;margin-bottom:16px}
  .card{background:var(--bg3);border:1px solid var(--border2);border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 12px 32px rgba(0,0,0,.3)}
  .hosp{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .name{font-size:19px;font-weight:700;margin-bottom:2px}
  .pid{font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--blue);margin-bottom:14px}
  .status-badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:6px;padding:3px 9px;margin-bottom:14px}
  .status-admitted{background:rgba(79,168,232,.14);color:var(--blue);border:1px solid rgba(79,168,232,.3)}
  .status-discharged{background:rgba(16,163,110,.12);color:var(--green);border:1px solid rgba(16,163,110,.3)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-bottom:4px}
  .field-label{font-size:9.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
  .field-value{font-size:13px;font-weight:600;color:var(--text)}
  .section-label{font-size:10.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;padding-top:14px;border-top:1px solid var(--border)}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px}
  .tag{background:var(--bg4);border:1px solid var(--border2);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--text2)}
  .tag.allergy{background:rgba(229,72,77,.1);border-color:rgba(229,72,77,.3);color:var(--red)}
  .empty-note{font-size:11.5px;color:var(--text3);font-style:italic}
  .balance-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .balance-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
  .balance-value{font-size:20px;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .balance-value.zero{color:var(--green)}
  .balance-value.owing{color:var(--amber)}
  .footer-note{font-size:10px;color:var(--text3);text-align:center;line-height:1.6;margin-top:18px}
  .error-card{text-align:center;padding:40px 24px}
  .error-icon{font-size:34px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">N<sup style="font-size:9px">3</sup></div>
    <div>
      <div class="brand-name">SmartCare AI</div>
      <div class="brand-sub">Patient Information</div>
    </div>
  </div>

  <div id="content"></div>
</div>

<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const name = params.get('n') || '';
  const pid = params.get('pid') || '';
  const age = params.get('a') || '';
  const gender = params.get('g') || '';
  const hosp = params.get('hosp') || 'SmartCare Hospital';
  const ward = params.get('ward') || '';
  const bed = params.get('bed') || '';
  const status = params.get('stat') || '';
  const diagnosis = params.get('dx') || '';
  const meds = (params.get('meds') || '').split(';').map(s => s.trim()).filter(Boolean);
  const allergies = (params.get('allergies') || '').split(';').map(s => s.trim()).filter(Boolean);
  const balance = parseFloat(params.get('bal') || '0') || 0;
  const content = document.getElementById('content');

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  if (!pid || !name) {
    content.innerHTML = `
      <div class="card error-card">
        <div class="error-icon">🔍</div>
        <div style="font-weight:700;margin-bottom:6px">No patient info in this link</div>
        <div style="font-size:12px;color:var(--text3)">This QR code didn't carry any patient details — ask the hospital to reissue the card.</div>
      </div>`;
    return;
  }

  content.innerHTML = `
    <div class="warn">
      ⚠ This page shows information from a QR code with no sign-in required. Anyone who scans this exact code can see it too — keep this card as safe as you would a passport.
    </div>
    <div class="card">
      <div class="hosp">${escapeHtml(hosp)}</div>
      <div class="name">${escapeHtml(name)}</div>
      <div class="pid">${escapeHtml(pid)}</div>
      ${status ? `<div class="status-badge status-${status === 'discharged' ? 'discharged' : 'admitted'}">${status === 'discharged' ? '✓ Discharged' : '● Currently Admitted'}</div>` : ''}
      <div class="grid">
        ${age ? `<div><div class="field-label">Age</div><div class="field-value">${escapeHtml(age)}y</div></div>` : ''}
        ${gender ? `<div><div class="field-label">Gender</div><div class="field-value">${escapeHtml(gender)}</div></div>` : ''}
        ${status === 'admitted' && ward ? `<div><div class="field-label">Ward</div><div class="field-value">${escapeHtml(ward)}</div></div>` : ''}
        ${status === 'admitted' && bed ? `<div><div class="field-label">Bed</div><div class="field-value">${escapeHtml(bed)}</div></div>` : ''}
      </div>

      <div class="section-label">🩺 Diagnosis</div>
      ${diagnosis ? `<div class="field-value" style="font-weight:500">${escapeHtml(diagnosis)}</div>` : '<div class="empty-note">None on file</div>'}

      <div class="section-label">💊 Current Medications</div>
      ${meds.length ? `<div class="tag-row">${meds.map(m => `<span class="tag">${escapeHtml(m)}</span>`).join('')}</div>` : '<div class="empty-note">None on file</div>'}

      <div class="section-label">⚠ Allergies</div>
      ${allergies.length ? `<div class="tag-row">${allergies.map(a => `<span class="tag allergy">${escapeHtml(a)}</span>`).join('')}</div>` : '<div class="empty-note">None on file</div>'}

      <div class="section-label">💳 Billing</div>
      <div class="balance-row">
        <span class="balance-label">Outstanding Balance</span>
        <span class="balance-value ${balance > 0 ? 'owing' : 'zero'}">$${balance.toFixed(2)}</span>
      </div>
    </div>

    <div class="footer-note">
      🔒 This is a snapshot from when the card was issued/printed, not a live record — for current details, contact ${escapeHtml(hosp)} directly.
    </div>`;
})();
</script>
</body>
</html>
