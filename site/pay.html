<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartCare AI – Make a Payment</title>
<style>
  :root{
    --bg:#0a1628; --bg2:#0f1e35; --bg3:#16263f; --bg4:#1c3050;
    --border:#243854; --border2:#2d4468;
    --text:#eaf1fb; --text2:#a9bfd9; --text3:#6b88a8;
    --green:#10a36e; --green-tint:rgba(16,163,110,.12);
    --blue:#4fa8e8; --navy:#14407a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;padding:20px 14px 40px}
  .wrap{max-width:460px;margin:0 auto;border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:26px 20px 22px;box-shadow:0 0 0 1px rgba(255,255,255,.03) inset}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),#7c9cf0);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#fff;flex-shrink:0}
  .brand-name{font-size:14px;font-weight:700}
  .brand-sub{font-size:10.5px;color:var(--text3)}
  .card{background:var(--bg3);border:1px solid var(--border2);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 12px 32px rgba(0,0,0,.3)}
  .hosp{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .patient{font-size:15px;font-weight:600;margin-bottom:14px}
  .ref-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg4);border:1px solid var(--border2);border-radius:9px;padding:9px 12px;margin-bottom:18px}
  .ref-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
  .ref-value{font-size:12px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--blue)}
  .amount-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;text-align:center}
  .amount{font-size:38px;font-weight:800;color:var(--green);text-align:center;margin:6px 0 2px;letter-spacing:-1px}
  .inv-id{font-size:11px;color:var(--text3);text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .methods-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .method{background:var(--bg4);border:1px solid var(--border2);border-radius:12px;margin-bottom:10px;overflow:hidden;cursor:pointer;transition:border-color .15s}
  .method:hover{border-color:var(--blue)}
  .method-head{display:flex;align-items:center;gap:12px;padding:14px 16px}
  .method-icon{width:36px;height:36px;border-radius:10px;background:rgba(79,168,232,.14);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
  .method-icon.logo-icon{background:#fff;padding:5px}
  .method-icon.logo-icon svg{width:100%;height:100%;display:block}
  .method-title{font-size:13.5px;font-weight:700;flex:1}
  .method-chevron{font-size:11px;color:var(--text3);transition:transform .2s}
  .method.open .method-chevron{transform:rotate(180deg)}
  .method-body{max-height:0;overflow:hidden;transition:max-height .25s ease}
  .method.open .method-body{max-height:200px}
  .method-body-inner{padding:0 16px 16px 64px;font-size:12px;color:var(--text2);line-height:1.6}
  .placeholder-tag{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);border-radius:5px;padding:2px 6px;margin-top:8px}
  .footer-note{font-size:10.5px;color:var(--text3);text-align:center;line-height:1.6;margin-top:20px}
  .error-card{text-align:center;padding:40px 24px}
  .error-icon{font-size:34px;margin-bottom:10px}
  .field-label{font-size:10.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;display:block}
  .field-input{width:100%;background:var(--bg4);border:1px solid var(--border2);border-radius:9px;padding:11px 13px;color:var(--text);font-size:13.5px;font-family:inherit;margin-bottom:14px}
  .field-input:focus{outline:none;border-color:var(--blue)}
  .field-input::placeholder{color:var(--text3)}
  .continue-btn{width:100%;padding:13px;border-radius:11px;border:none;background:linear-gradient(135deg,var(--blue),#7c9cf0);color:#fff;font-size:13.5px;font-weight:700;cursor:pointer}
  .continue-btn:disabled{opacity:.5;cursor:not-allowed}
  .general-note{font-size:11px;color:var(--text3);line-height:1.5;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">N<sup style="font-size:9px">3</sup></div>
    <div>
      <div class="brand-name">SmartCare AI</div>
      <div class="brand-sub">Secure Payment</div>
    </div>
  </div>

  <div id="content"></div>

  <div class="footer-note">
    🔒 This link only displays payment details already sent to you — no payment information is transmitted or stored by this page.
  </div>
</div>

<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const inv = params.get('inv') || '';
  const pid = params.get('pid') || '';
  const amtParam = params.get('amt');
  const patient = params.get('patient') || '';
  const hosp = params.get('hosp') || 'SmartCare Hospital';
  const content = document.getElementById('content');
  const isPatientSpecific = !!(inv && amtParam);

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Same placeholder defaults as getPaymentGatewayConfig() in the main
  // app — this page is intentionally standalone (opened on a patient's
  // own phone, a different device entirely from wherever the link was
  // generated) so it can't read that app's localStorage config. Swap
  // these for real merchant details once a payment provider is wired up.
  // Simple, small-scale wordmark/badge recreations (not pixel copies of the
  // official artwork) used purely to visually flag which payment brands are
  // accepted — standard practice on merchant payment pages.
  const ECOCASH_LOGO_SVG = '<svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg"><text x="6" y="40" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="27" fill="#0a5eb0">Eco</text><text x="60" y="40" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="27" fill="#e4002b">Cash</text></svg>';
  const CARD_LOGO_SVG = '<svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg"><text x="4" y="38" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-style="italic" font-size="21" fill="#1a1f71">VISA</text><circle cx="88" cy="30" r="15" fill="#eb001b"/><circle cx="102" cy="30" r="15" fill="#f79e1b" opacity="0.85"/></svg>';

  function buildMethods(amount, reference){
    const amtText = amount != null ? '$' + Number(amount).toFixed(2) : 'the amount owing';
    return [
      { icon: ECOCASH_LOGO_SVG, isLogo: true, title: 'EcoCash', body: 'Dial <b>*151#</b> → Merchant Payment → Enter Merchant Code <b>000000</b> → Enter Amount <b>' + amtText + '</b>' + (reference ? ' → Reference <b>' + escapeHtml(reference) + '</b>' : '') + ' → Confirm with PIN.', placeholder: true },
      { icon: CARD_LOGO_SVG, isLogo: true, title: 'Card', body: 'Card payments are currently taken at the billing office, or by phone — see the hospital\'s contact details on your receipt.' + (reference ? ' Please quote reference <b>' + escapeHtml(reference) + '</b>.' : ''), placeholder: true },
      { icon: '🌐', isLogo: false, title: 'Online Payment', body: 'Online card/bank payment — coming soon.', placeholder: true },
      { icon: '🏥', isLogo: false, title: 'Pay In Person', body: 'Visit the ' + escapeHtml(hosp) + ' billing office. Cash, card and EcoCash are all accepted on-site.' + (reference ? ' Please quote reference <b>' + escapeHtml(reference) + '</b>.' : ''), placeholder: false },
    ];
  }

  function renderMethods(amount, reference){
    const methods = buildMethods(amount, reference);
    const methodsEl = document.getElementById('methods');
    methodsEl.innerHTML = methods.map((m, i) => `
      <div class="method" id="method-${i}" onclick="toggleMethod(${i})">
        <div class="method-head">
          <div class="method-icon${m.isLogo ? ' logo-icon' : ''}">${m.icon}</div>
          <div class="method-title">${escapeHtml(m.title)}</div>
          <div class="method-chevron">▾</div>
        </div>
        <div class="method-body">
          <div class="method-body-inner">${m.body}${m.placeholder ? '<div class="placeholder-tag">Placeholder — to be confirmed</div>' : ''}</div>
        </div>
      </div>
    `).join('');
  }

  window.toggleMethod = function(i){
    document.querySelectorAll('.method').forEach((el, idx) => {
      if (idx === i) el.classList.toggle('open');
      else el.classList.remove('open');
    });
  };

  if (isPatientSpecific) {
    // Sent directly to one patient — every detail already known, nothing
    // to fill in. Patient ID doubles as the payment reference to quote.
    const amt = parseFloat(amtParam);
    content.innerHTML = `
      <div class="card">
        <div class="hosp">${escapeHtml(hosp)}</div>
        <div class="patient">${patient ? escapeHtml(patient) : 'Patient Account'}</div>
        ${pid ? `<div class="ref-row"><span class="ref-label">Patient ID / Reference</span><span class="ref-value">${escapeHtml(pid)}</span></div>` : ''}
        <div class="amount-label">Amount Due</div>
        <div class="amount">$${amt.toFixed(2)}</div>
        <div class="inv-id">${escapeHtml(inv)}</div>
      </div>
      <div class="methods-label">Choose how you'd like to pay</div>
      <div id="methods"></div>
    `;
    renderMethods(amt, pid || inv);
  } else {
    // A general, non-patient-specific link (e.g. a poster/QR code at
    // reception) — whoever opens it fills in their own details first.
    content.innerHTML = `
      <div class="card">
        <div class="hosp">${escapeHtml(hosp)}</div>
        <div class="patient" style="margin-bottom:16px">Make a Payment</div>
        <div class="general-note">Enter your details below — your Patient ID is on your SmartCare registration card or any invoice/receipt you've received.</div>
        <label class="field-label">Full Name</label>
        <input class="field-input" id="gp-name" placeholder="e.g. Nomsa Dlamini">
        <label class="field-label">Patient ID / Reference</label>
        <input class="field-input" id="gp-pid" placeholder="e.g. PGH-P0002-26">
        <label class="field-label">Amount to Pay</label>
        <input class="field-input" id="gp-amount" type="number" min="0" step="0.01" placeholder="0.00">
        <button class="continue-btn" id="gp-continue" onclick="submitGeneral()">Continue →</button>
      </div>
      <div id="methods-wrap" style="display:none">
        <div class="methods-label">Choose how you'd like to pay</div>
        <div id="methods"></div>
      </div>
    `;
    window.submitGeneral = function(){
      const name = document.getElementById('gp-name').value.trim();
      const pidVal = document.getElementById('gp-pid').value.trim();
      const amount = parseFloat(document.getElementById('gp-amount').value);
      if (!name || !pidVal || !amount || amount <= 0) {
        alert('Please fill in your name, patient ID, and a valid amount.');
        return;
      }
      renderMethods(amount, pidVal);
      document.getElementById('methods-wrap').style.display = 'block';
      document.getElementById('gp-continue').textContent = '✓ Details Saved';
      document.getElementById('gp-continue').disabled = true;
      document.getElementById('methods-wrap').scrollIntoView({ behavior: 'smooth' });
    };
  }

  if (!hosp && !isPatientSpecific) {
    // Neither a patient-specific link nor even a hospital name — likely a
    // stray/malformed link rather than an intentional general link.
  }
})();
</script>
</body>
</html>
